name: ClusterFuzzLite batch fuzzing
on:
  workflow_dispatch:

permissions: read-all

jobs:
  BatchFuzzing:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer:
        - address
        - undefined
        # - memory # some problems with linking
    steps:
    - name: Build Fuzzers (${{ matrix.sanitizer }})
      id: build
      uses: google/clusterfuzzlite/actions/build_fuzzers@v1
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        language: c++ # Change this to the language you are fuzzing.
        sanitizer: ${{ matrix.sanitizer }}
    - name: Run Fuzzers (${{ matrix.sanitizer }})
      id: run
      uses: google/clusterfuzzlite/actions/run_fuzzers@v1
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        fuzz-seconds: 3600
        mode: 'batch'
        sanitizer: ${{ matrix.sanitizer }}
        output-sarif: true
        # Optional but recommended: For storing certain artifacts from fuzzing.
        # See later section on "Git repo for storage".
        # storage-repo: https://${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/OWNER/STORAGE-REPO-NAME.git
        # storage-repo-branch: main   # Optional. Defaults to "main"
        # storage-repo-branch-coverage: gh-pages  # Optional. Defaults to "gh-pages".
    - name: Checkout OSS-Fuzz-DAOS
      if: always()
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 1
        path: oss-fuzz-daos
        persist-credentials: false
    - name: Reproduce crashes (${{ matrix.sanitizer }})
      id: reproduce
      if: always()
      env:
        SANITIZER: ${{ matrix.sanitizer }}
        # Same image ClusterFuzzLite uses to run fuzzers, so sanitizer runtime and options match.
        IMAGE: gcr.io/oss-fuzz-base/clusterfuzzlite-run-fuzzers:v1
      run: bash oss-fuzz-daos/.github/workflows/reproduce_crashes.sh
